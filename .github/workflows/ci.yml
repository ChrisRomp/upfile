name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.ref_type == 'tag' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Tests and build
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
      version: ${{ steps.publication.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Select publication channel
        id: publication
        env:
          EVENT_DELETED: ${{ github.event.deleted || false }}
        run: node scripts/container-tags.mjs channel
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - name: Install frontend and browser test dependencies
        run: |
          node --test scripts/*.test.mjs
          node scripts/check-lockfile-integrity.mjs
          npm ci --prefix web
          npm ci --prefix e2e
      - name: Frontend tests and type-checked build
        run: |
          npm test --prefix web
          npm run build --prefix web
      - name: Go formatting, static analysis, and race tests
        run: |
          unformatted="$(gofmt -l cmd internal web/embed.go)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -race ./...
      - name: Build production and isolated development binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/upfile ./cmd/upfile
          go build -o dist/upfile-dev ./cmd/dev
      - name: Install Chromium
        working-directory: e2e
        run: npx --no-install playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        env:
          CI: "true"
          PLAYWRIGHT_CHANNEL: chromium
        run: npm test --prefix e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Docker build
    needs: checks
    if: needs.checks.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag upfile:ci .
      - name: Require production authentication configuration
        run: |
          if docker run --rm upfile:ci; then
            echo "Production must refuse to start without authentication configuration."
            exit 1
          fi

  publish-container:
    name: Publish Docker image
    needs: checks
    if: github.event_name == 'push' && !github.event.deleted && needs.checks.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ghcr-upfile-${{ github.ref_type == 'tag' && 'release' || 'main' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/chrisromp/upfile
      IMAGE_VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Build production image
        run: |
          docker build \
            --tag upfile:ci \
            --label "org.opencontainers.image.version=$IMAGE_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .
      - name: Require production authentication configuration
        run: |
          if docker run --rm upfile:ci; then
            echo "Production must refuse to start without authentication configuration."
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Select image tags from published versions
        id: tags
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/container-tags.mjs tags
      - name: Publish image tags
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          push_image() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker push "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              echo "Push failed; retrying in $((attempt * 5)) seconds."
              sleep $((attempt * 5))
            done
          }

          while IFS= read -r tag; do
            docker tag upfile:ci "$IMAGE_NAME:$tag"
            push_image "$IMAGE_NAME:$tag"
          done <<< "$IMAGE_TAGS"
